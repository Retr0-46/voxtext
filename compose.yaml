services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: voxtext
      POSTGRES_USER: voxtext
      POSTGRES_PASSWORD: ${VOXTEXT_DB_PASSWORD:-1234}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/internal/modules/auth/migrations/01_create_users_up.sql:/docker-entrypoint-initdb.d/01_create_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxtext -d voxtext"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
